[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csd-digital-twin"
version = "0.1.0"
description = "Digital twin of a three-station production line"
requires-python = ">=3.11"
dependencies = ["simpy>=4,<5"]

[project.optional-dependencies]
dashboard = ["streamlit>=1,<2", "plotly>=5,<7"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
